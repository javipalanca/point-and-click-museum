# Point and Click Museum · nginx in front of the static site and Murray's API.
limit_req_zone $binary_remote_addr zone=murray:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Murray: the only dynamic part. The API key lives in the murray container, never here or in the pages.
    location /api/murray/ {
        limit_req zone=murray burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://murray:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ { return 404; }

    # versioned assets (?v=build) and media can be cached for a long time; pages cannot
    location ~* \.(css|js|png|svg|gif|jpg|webp|wasm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.jsdos$ { default_type application/zip; expires 30d; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
