# Point and Click Museum · nginx in front of the static site and Murray's API.
# Behind another proxy on the same machine (e.g. Traefik, see docker-compose.edge.yml) the visitor's address comes in
# X-Forwarded-For: trust it only from private Docker networks, so that rate limits and statistics see real visitors.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
# https as the visitor saw it (the proxy in front ends TLS), for the panel's Secure cookie
map $http_x_forwarded_proto $pcm_proto { default $http_x_forwarded_proto; "" $scheme; }

limit_req_zone $binary_remote_addr zone=murray:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=games:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=stats:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /site/current;   # a symlink the builder swaps to the newest build (see tools/games_inbox.py)
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Murray's own numbers are for the control panel only (it asks him inside the Docker network)
    location = /api/murray/stats { return 404; }
    # usage events of the pages, without cookies (server/stats.py in the games container)
    location = /api/stats {
        limit_req zone=stats burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        access_log off;
        proxy_pass http://games:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
    # Murray: the only dynamic part. The API key lives in the murray container, never here or in the pages.
    location /api/murray/ {
        limit_req zone=murray burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://murray:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_buffering off;          # Murray streams his answer (Server-Sent Events)
        proxy_cache off;
    }
    # Games of the catalogue, brought on demand from ScummVM or Internet Archive by the games container
    location /api/games/ {
        limit_req zone=games burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://games:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;           # the first visitor of a game waits for its download
        proxy_max_temp_file_size 0;        # stream it, do not copy it again to disk
        proxy_http_version 1.1;
    }
    # Control panel of the catalogue (user and password, server/admin.py in the games container)
    location ~ ^/(admin|api/admin)(/|$) {
        limit_req zone=admin burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://games:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $pcm_proto;
        proxy_read_timeout 900s;           # testing a big game downloads it first
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 404; }

    # versioned assets (?v=build) and media can be cached for a long time; pages cannot
    location ~* \.(css|js|png|svg|gif|jpg|webp|wasm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # game bundles keep their name when you replace a zip in the inbox: always revalidate (ETag)
    location ~* \.jsdos$ { default_type application/zip; add_header Cache-Control "no-cache" always; }
    location /scummvm/games/ { add_header Cache-Control "no-cache" always; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
