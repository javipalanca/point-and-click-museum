# Point and Click Museum · `docker compose up -d --build`, then open http://localhost:8080/
# Settings come from .env (copy .env.example). Only the web container publishes a port.
services:
  # Builds the site and rebuilds it whenever you add, replace or remove a game in GAMES_DIR (default ./games).
  builder:
    build:
      context: .
      dockerfile: deploy/builder.Dockerfile
      args:
        PUBLIC: ${PUBLIC:-1}
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      GAMES_WATCH: ${GAMES_WATCH:-15}
      CATALOG_EVERY: ${CATALOG_EVERY:-24}            # hours between catalogue refreshes (ScummVM, Internet Archive, GOG)
      GAMES_VALIDATE_PER_RUN: ${GAMES_VALIDATE_PER_RUN:-20}   # new editions downloaded and checked per refresh
      GAMES_MAX_MB: ${GAMES_MAX_MB:-400}
      # statistics (see .env.example): Google Analytics only after the visitor accepts; the museum's own, without cookies
      PCM_GA_ID: ${GA_MEASUREMENT_ID:-}
      PCM_CLARITY_ID: ${CLARITY_ID:-}
      PCM_STATS_URL: ${STATS_URL-/api/stats}
    volumes:
      - ${GAMES_DIR:-./games}:/inbox:ro   # drop .zip / .jsdos files here (sub-folders too)
      - site:/site
      - games-cache:/cache
      - catalog:/catalog                  # data/catalog.json, refreshed daily
      - games-proxy:/games-proxy          # games checked by the catalogue sync, served by the games proxy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:false
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - site:/site:ro
    depends_on:
      builder:
        condition: service_healthy
      murray:
        condition: service_healthy
      games:
        condition: service_healthy
    restart: unless-stopped

  # Download proxy: brings a playable game from ScummVM or Internet Archive when a visitor opens it (server/games.py).
  games:
    build:
      context: .
      dockerfile: deploy/games.Dockerfile
    environment:
      GAMES_CACHE_MB: ${GAMES_CACHE_MB:-2048}   # games kept on the server at most (least recently used go first)
      GAMES_RATE: ${GAMES_RATE:-20}             # new downloads per visitor IP and hour
      GAMES_MAX_MB: ${GAMES_MAX_MB:-400}
      # control panel at /admin/ (off if empty); put them only in .env
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-0}   # 1 behind HTTPS
      PCM_STATS_DIR: /stats
      MURRAY_URL: http://murray:8080      # the panel asks Murray for his numbers inside this network
    volumes:
      - catalog:/catalog                  # the panel writes its decisions (catalog.admin.json) and sync requests here
      - games-proxy:/games-cache
      - stats:/stats                      # usage statistics, one small JSON file per day
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:false
    restart: unless-stopped

  murray:
    build:
      context: .
      dockerfile: deploy/murray.Dockerfile
    environment:
      # Any OpenAI-compatible chat completions API (vLLM, Ollama, llama.cpp, LM Studio, OpenRouter…).
      # Leave the URL or the model empty and Murray answers from the museum database only.
      MURRAY_LLM_BASE_URL: ${MURRAY_LLM_BASE_URL:-}
      MURRAY_LLM_API_KEY: ${MURRAY_LLM_API_KEY:-}
      MURRAY_LLM_MODEL: ${MURRAY_LLM_MODEL:-}
      MURRAY_LLM_TOOLS: ${MURRAY_LLM_TOOLS:-1}
      MURRAY_LLM_TEMPERATURE: ${MURRAY_LLM_TEMPERATURE:-0.7}
      MURRAY_LLM_MAX_TOKENS: ${MURRAY_LLM_MAX_TOKENS:-900}
      MURRAY_LLM_THINK: ${MURRAY_LLM_THINK:-0}
      MURRAY_LLM_EXTRA: ${MURRAY_LLM_EXTRA:-}
      MURRAY_GUARD: ${MURRAY_GUARD:-strict}
      MURRAY_RATE: ${MURRAY_RATE:-30}
      MURRAY_DAILY_LIMIT: ${MURRAY_DAILY_LIMIT:-2000}
      PCM_STATS_DIR: /stats               # counts and response times only, never the questions
    volumes:
      - murray-stats:/stats
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets you point MURRAY_LLM_BASE_URL at a model server on the host
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:false
    restart: unless-stopped

volumes:
  site:          # the built site (written by builder, served by web)
  games-cache:   # games of the inbox already converted, so that a restart does not convert them again
  catalog:       # the automatic catalogue (tools/sync_catalog.py)
  games-proxy:   # games of the catalogue brought on demand (server/games.py), size-limited
  stats:         # usage statistics of the site and the games proxy (server/stats.py)
  murray-stats:  # Murray's statistics (questions answered, latency), no message contents
