<section class="room-page" id="room-chronology" aria-labelledby="page-title">
  <div class="wrap">
    {{raw:pageHeader}}
      <article class="px game" id="g-order">
        <p class="how">{{raw:orderHow}}</p>
        <div class="order-list" id="orderList"></div>
        <div class="row">
          <button class="pbtn small" id="orderCheck" type="button">{{t:check}}</button><button class="pbtn small" id="orderNew" type="button">{{t:newRound}}</button>
          <span class="result" id="orderMsg" aria-live="polite"></span>
        </div>
      </article>
  </div>
</section>
