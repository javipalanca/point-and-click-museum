<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ScummVM · Point and Click Museum</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f3e6c8; font: 16px "Courier New", monospace; }
  canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; }
  #status { position: absolute; inset: auto 0 0 0; padding: 8px 12px; background: rgba(19,28,30,.85); font-size: 14px; }
  #status:empty { display: none; }
  #status.error { color: #ef5d8a; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status" role="status" aria-live="polite"></div>
<script src="player.js"></script>
</body>
</html>
